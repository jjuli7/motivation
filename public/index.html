<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#000000" />
  <title>Motivation</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="start" class="start">
    <button id="startBtn" class="start-btn">ENTRAR</button>
    <p id="startInfo" class="start-info"></p>
    <a class="credits-link" href="/credits.html">credits</a>
  </div>

  <main id="stage" class="stage" hidden>
    <div id="slide" class="slide"></div>

    <div class="hud" id="hud">
      <div class="track" id="track"></div>
      <div class="controls">
        <button id="prevSong" title="Cancion anterior / reiniciar (Q)">&#9198;</button>
        <button id="playPause" title="Pausar musica (M)">&#10074;&#10074;</button>
        <button id="nextSong" title="Cancion aleatoria (E)">&#128256; SKIP</button>
        <span class="vol">
          <button id="volIcon" title="Silenciar">&#128266;</button>
          <input id="volume" type="range" min="0" max="100" value="80" aria-label="Volumen" title="Volumen (+/-)" />
        </span>
        <button id="auto" title="Auto-avance (A)">AUTO</button>
        <button id="clipSound" title="Sonido de clips (S)">CLIP &#128263;</button>
        <button id="fs" title="Pantalla completa (F)">&#9974;</button>
      </div>
    </div>
    <div class="counter" id="counter"></div>
  </main>

  <audio id="audio" preload="auto"></audio>
  <script src="/app.js"></script>
</body>
</html>
